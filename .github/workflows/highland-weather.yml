name: Highland weather cloud
on:
  workflow_dispatch:
  schedule:
    - cron: '7 0,4,8,12,16,20 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: highland-weather-cloud
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.HIGHLAND_CLOUD_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt
      - run: python cloud/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: weather-test
          path: |
            cloud/site/index.html
            cloud/Temperature_Raw_Log_v1_9.csv
      - name: Save history and website
        if: vars.HIGHLAND_CLOUD_LIVE == 'true'
        run: |
          cp cloud/site/index.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/Temperature_Raw_Log_v1_9.csv index.html
          git diff --cached --quiet || git commit -m 'Update Highland weather observations'
          git push
      - uses: actions/upload-pages-artifact@v3
        if: vars.HIGHLAND_CLOUD_LIVE == 'true'
        with:
          path: cloud/site
  deploy:
    if: vars.HIGHLAND_CLOUD_LIVE == 'true'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
